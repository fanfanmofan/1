workflows:
ios-build-zip:
name: Build iOS App & Extension ZIP
max_build_duration: 30
environment:
xcode: latest
scripts:
- name: Clean accidental markdown fences & Generate Project
script: |
for f in *.swift *.yml; do
[ -f "$f" ] && sed -i '' '/^```/d' "$f"
done
ls -la
brew install xcodegen
xcodegen generate
- name: Build Unsigned .app
script: |
xcodebuild build 
-project XqAssist.xcodeproj 
-scheme XqAssist 
-configuration Release 
-sdk iphoneos 
-derivedDataPath build 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO
- name: Package as ZIP (IPA)
script: |
mkdir -p Payload
cp -r build/Build/Products/Release-iphoneos/XqAssist.app Payload/
zip -r XqAssist_Unsigned.zip Payload
artifacts:
- XqAssist_Unsigned.zip
