workflows:
  xqassist:
    name: XqAssist
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generate project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned
        script: |
          xcodebuild -project XqAssist.xcodeproj -scheme XqAssist \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/XqAssist.app Payload/
          zip -qr XqAssist.ipa Payload
    artifacts:
      - XqAssist.ipa
