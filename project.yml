name: XqAssist
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  XqAssist:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - "SampleHandler.swift"
    entitlements:
      path: XqAssist.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.xqassist
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 象棋助手
        UIBackgroundModes:
          - audio
          - picture-in-picture
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xqassist

  XqBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes:
          - "SampleHandler.swift"
          - "Vision.swift"
          - "Xiangqi.swift"
    entitlements:
      path: XqBroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.xqassist
    info:
      path: ExtensionInfo.plist
      properties:
        CFBundleDisplayName: 象棋屏幕监控
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xqassist.broadcast
